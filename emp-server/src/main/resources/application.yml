server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      force: true

spring:
  application:
    name: emp-server
  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_academy?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      # 服务端转发上传只面向头像、图片、PDF 等小文件；视频走预签名直传，与 FileController 的 50MB 限制对齐
      max-file-size: 51MB
      max-request-size: 55MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false

emp:
  cache:
    api-response-ttl: ${API_RESPONSE_CACHE_TTL:1s}
  jwt:
    # 生产环境务必用 EMP_JWT_SECRET 覆盖；密钥至少 32 字节，JWT 算法按密钥长度自动选择
    secret: ${EMP_JWT_SECRET:emp-academy-dev-secret-key-change-me-in-production-2025}
    # 访问令牌短时效，前端通过 /auth/refresh 自动续期
    expire-minutes: ${EMP_JWT_EXPIRE_MINUTES:15}
    issuer: emp-server
    # 允许跨域的前端地址，逗号分隔；留空时只允许本机 3000/5173 开发端口
    allowed-origins: ${EMP_ALLOWED_ORIGINS:}
  auth:
    # 刷新令牌有效期（天）与登录 / 注册限流
    refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:7}
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    max-login-ip-attempts: ${AUTH_MAX_LOGIN_IP_ATTEMPTS:30}
    login-window-minutes: ${AUTH_LOGIN_WINDOW_MINUTES:15}
    max-register-attempts: ${AUTH_MAX_REGISTER_ATTEMPTS:5}
    register-window-minutes: ${AUTH_REGISTER_WINDOW_MINUTES:60}
    # 仅在可信反向代理之后才信任 X-Forwarded-For / X-Real-IP，避免伪造 IP 绕过限流
    trust-forwarded-headers: ${AUTH_TRUST_FORWARDED_HEADERS:false}
    # 演示模式允许 password_hash 为空的种子账号用 123456 登录；本地默认开启以便直接启动，生产必须显式设为 false
    demo-mode: ${EMP_DEMO_MODE:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:zhang}
    secret-key: ${MINIO_SECRET_KEY:12345678}
    bucket: ${MINIO_BUCKET:emp-academy}
    # 默认不开放公共读；/files/view/** 是公开稳定地址，敏感文件请用预签名 URL
    public-read: ${MINIO_PUBLIC_READ:false}
    # 预签名 URL 有效期：视频播放与附件下载共用
    presign-expiry-minutes: 60

logging:
  level:
    root: info
