server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: emp-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enterprise_academy?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      # 课程视频走分片直传，普通课件/头像走服务端转发，这里放开单文件上限
      max-file-size: 2048MB
      max-request-size: 2048MB
  mvc:
    problemdetails:
      enabled: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.joker.emp.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

emp:
  cache:
    api-response-ttl: ${API_RESPONSE_CACHE_TTL:1s}
  jwt:
    # 生产环境务必用 EMP_JWT_SECRET 覆盖；HS256 要求至少 32 字节
    secret: ${EMP_JWT_SECRET:emp-academy-dev-secret-key-change-me-in-production-2025}
    # 访问令牌短时效，前端通过 /auth/refresh 自动续期
    expire-minutes: ${EMP_JWT_EXPIRE_MINUTES:15}
    issuer: emp-server
  auth:
    # 刷新令牌有效期（天）与登录 / 注册限流
    refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:7}
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    max-login-ip-attempts: ${AUTH_MAX_LOGIN_IP_ATTEMPTS:30}
    login-window-minutes: ${AUTH_LOGIN_WINDOW_MINUTES:15}
    max-register-attempts: ${AUTH_MAX_REGISTER_ATTEMPTS:5}
    register-window-minutes: ${AUTH_REGISTER_WINDOW_MINUTES:60}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:zhang}
    secret-key: ${MINIO_SECRET_KEY:12345678}
    bucket: ${MINIO_BUCKET:emp-academy}
    # 演示环境将桶设置为公共只读；生产请改为 false 并统一使用预签名 URL
    public-read: ${MINIO_PUBLIC_READ:true}
    # 预签名 URL 有效期：视频播放与附件下载共用
    presign-expiry-minutes: 60

logging:
  level:
    root: info
    com.joker.emp: info
