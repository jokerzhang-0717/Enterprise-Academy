            example:
              isTop: true
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录接口返回的 15 分钟访问令牌，填入 `Bearer <token>`；过期后用 `/auth/refresh` 换发。

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema: { type: integer, format: int64, default: 1, minimum: 1 }
    SizeQuery:
      name: size
      in: query
      required: false
      description: 每页条数
      schema: { type: integer, format: int64, default: 10, minimum: 1 }
    SizeQuery12:
      name: size
      in: query
      required: false
      description: 每页条数（课程/通道默认 12）
      schema: { type: integer, format: int64, default: 12, minimum: 1 }
    KeywordQuery:
      name: keyword
      in: query
      required: false
      description: 关键词，通常匹配标题/名称/工号
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      description: 主键 ID
      schema: { type: integer, format: int64 }
    ChapterIdPath:
      name: chapterId
      in: path
      required: true
      description: 章节 ID
      schema: { type: integer, format: int64 }
    LessonIdPath:
      name: lessonId
      in: path
      required: true
      description: 课时 ID
      schema: { type: integer, format: int64 }
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      description: 考试指派记录 ID
      schema: { type: integer, format: int64 }
    AttemptIdPath:
      name: attemptId
      in: path
      required: true
      description: 答卷 ID
      schema: { type: integer, format: int64 }
    SerialPath:
      name: serial
      in: path
      required: true
      description: 证书编号
      schema: { type: string }
    ObjectNameQuery:
      name: objectName
      in: query
      required: true
      description: MinIO 对象名（含目录），如 `avatar/2026/11/xxx.png`
      schema: { type: string }
    ObjectNamePath:
      name: objectName
      in: path
      required: true
      description: MinIO 对象名（含目录），路径中可包含 `/`
      schema: { type: string }
    FromDateQuery:
      name: from
      in: query
      required: false
      description: 开始日期，格式 yyyy-MM-dd
      schema: { type: string, format: date }
    ToDateQuery:
      name: to
      in: query
      required: false
      description: 结束日期，格式 yyyy-MM-dd
      schema: { type: string, format: date }

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 0
            message: ok
            data: {}
    OkVoid:
      description: 成功（无业务数据）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 0
            message: ok
            data: null
    BadRequest:
      description: 参数错误 / 业务校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 400
            message: 参数校验失败
            data: null
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 401
            message: 未登录或登录已过期
            data: null
    Forbidden:
      description: 无权限（管理员接口需要 role=2，或操作了他人数据）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 403
            message: 无权限访问
            data: null
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 404
            message: 资源不存在
            data: null
    Conflict:
      description: 数据冲突（工号/编号重复等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 409
            message: 该工号已注册
            data: null
    PayloadTooLarge:
      description: 上传文件超过大小限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 413
            message: 上传文件超过大小限制
            data: null
    TooManyRequests:
      description: 请求过于频繁（登录失败次数超限或注册过于频繁）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 429
            message: 登录失败次数过多，请稍后再试
            data: null
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 500
            message: 服务器内部错误
            data: null

  schemas:
    ApiResponse:
      type: object
      description: 统一响应体
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 表示成功，其它与 HTTP 状态码一致
          example: 0
        message:
          type: string
          example: ok
        data:
          description: 业务数据，可能是对象、数组、字符串、数字、布尔或 null（未限定类型，任意 JSON 值均合法）
      additionalProperties: false

    PageResult:
      type: object
      description: 分页数据（通常位于 ApiResponse.data）
      required: [total, page, size, records]
      properties:
        total:
          type: integer
          format: int64
          example: 12
        page:
          type: integer
          format: int64
          example: 1
        size:
          type: integer
          format: int64
          example: 10
        records:
          type: array
          items:
            type: object
            additionalProperties: true

    LoginRequest:
      type: object
      required: [employeeNo, password]
      properties:
        employeeNo:
          type: string
          description: 企业工号
          example: EMP-2024098
        password:
          type: string
          description: 登录密码
          format: password
          example: '123456'

    RegisterRequest:
      type: object
      required: [name, employeeNo, password]
      properties:
        name:
          type: string
          example: 王小明
        employeeNo:
          type: string
          example: EMP-2026001
        password:
          type: string
          format: password
          minLength: 6
          example: '123456'
        departmentId:
          type: integer
          format: int64
          nullable: true
          example: 1
        jobTitle:
          type: string
          nullable: true
          example: 研发工程师
        email:
          type: string
          format: email
          nullable: true
          example: wangxm@example.com
        phone:
          type: string
          nullable: true
          example: '13900000000'

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
          example: '123456'
        newPassword:
          type: string
          format: password
          minLength: 6
          example: '654321'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 登录或上一次刷新返回的一次性刷新令牌
          example: b_V4Y2F0aW9uLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: 需要吊销的刷新令牌；访问令牌通过 Authorization 请求头传入
          example: b_V4Y2F0aW9uLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ

    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: 李明
        gender:
          type: string
          nullable: true
          description: 性别：男 / 女，空串表示清除
          example: 男
        age:
          type: integer
          nullable: true
          example: 28
        phone:
          type: string
          nullable: true
          example: '13800000000'
        email:
          type: string
          format: email
          nullable: true
          example: liming@example.com
        jobTitle:
          type: string
          nullable: true
          example: 高级研发工程师
        specialty:
          type: string
          nullable: true
          example: 云原生与微服务
        grade:
          type: string
          nullable: true
          example: P6 高级研发
        avatarUrl:
          type: string
          nullable: true
          example: http://127.0.0.1:8080/api/files/view/avatar/demo.png

    ProgressRequest:
      type: object
      properties:
        watchedSeconds:
          type: integer
          minimum: 0
          description: 已观看秒数，仅用于断点续播；服务端按课时时长截断，不作为完成依据
          example: 600
        completed:
          type: boolean
          description: 是否完成本课时；服务端会校验累计学习时长，不足时返回 400
          example: true

    StudySessionRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 客户端生成的学习会话标识
          example: 7f6f2e5e-1b98-49a3-a31b-4e8208e8f91a

    AnswerSaveRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          format: int64
          example: 1
        selectedKeys:
          type: string
          nullable: true
          description: 客观题选项，多选按字母序拼接（如 `ABD`）
          example: A
        answerText:
          type: string
          nullable: true
          description: 主观题作答内容
        flagged:
          type: boolean
          nullable: true
          description: 是否标记待复查
          example: false
        remainingSeconds:
          type: integer
          nullable: true
          description: 剩余作答秒数，用于断点续考
          example: 1800

    LeaveSaveRequest:
      type: object
      required: [leaveType, startDate, reason]
      properties:
        leaveType:
          type: string
          description: 项目紧急发版 / 病假 / 因公外出 / 个人事务
          example: 病假
        trainingTitle:
          type: string
          nullable: true
          description: 缺席的培训/课程名称
          example: 云原生微服务架构实战
        courseId:
          type: integer
          format: int64
          nullable: true
          example: 1
        startDate:
          type: string
          format: date
          example: '2026-12-01'
        endDate:
          type: string
          format: date
          nullable: true
          description: 不传时等于 startDate
          example: '2026-12-02'
        leaveDays:
          type: number
          format: double
          nullable: true
          description: 不传时按日期区间自动计算
          example: 2
        reason:
          type: string
          example: 身体不适需要休息
        attachmentUrl:
          type: string
          nullable: true
          description: 病假单据等附件地址
          example: null

    CheckinAction:
      type: object
      properties:
        method:
          type: integer
          nullable: true
          description: 1 人脸识别 / 2 工牌刷卡 / 3 移动端定位
          example: 3

    NotificationReadRequest:
      type: object
      properties:
        isRead:
          type: boolean
          nullable: true
          description: 不传默认为 true
          example: true

    NotificationSendRequest:
      type: object
      required: [userIds, type, title]
      properties:
        userIds:
          type: array
          items: { type: integer, format: int64 }
          example: [1, 2]
        type:
          type: integer
          description: 1 考试 / 2 课程 / 3 考勤 / 4 公告 / 5 培训考勤
          example: 1
        typeLabel:
          type: string
          nullable: true
          example: 考试
        priority:
          type: integer
          nullable: true
          description: 1 普通 / 2 加急
          example: 1
        title:
          type: string
          example: 考试提醒
        summary:
          type: string
          nullable: true
          example: 您有一场考试即将开始
        content:
          type: string
          nullable: true
          example: 请在规定时间内完成考试。
        bulletPoints:
          type: array
          nullable: true
          items: { type: string }
          example: [提前 10 分钟进入考场, 保持网络稳定]
        senderName:
          type: string
          nullable: true
          example: 培训中心
        officialRefNo:
          type: string
          nullable: true
          example: SEC-2025-Q2-0892
        refType:
          type: string
          nullable: true
          description: exam / course / attendance / announcement
          example: exam
        refId:
          type: integer
          format: int64
          nullable: true
          example: 1
        durationLabel:
          type: string
          nullable: true
          example: 90 分钟
        passingScoreLabel:
          type: string
          nullable: true
          example: 60分及格

    PresignUploadRequest:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          example: course-video.mp4
        contentType:
          type: string
          nullable: true
          example: video/mp4
        folder:
          type: string
          nullable: true
          description: 自定义目录，如 avatar / course / attachment
          example: course

    UserSaveRequest:
      type: object
      required: [name, employeeNo]
      properties:
        name:
          type: string
          example: 王小明
        employeeNo:
          type: string
          example: EMP-2026002
        password:
          type: string
          format: password
          nullable: true
          description: 新增时使用，不传默认 123456；更新时忽略
          example: '123456'
        departmentId:
          type: integer
          format: int64
          nullable: true
          example: 1
        jobTitle:
          type: string
          nullable: true
          example: 研发工程师
        grade:
          type: string
          nullable: true
          example: P5
        specialty:
          type: string
          nullable: true
          example: 前端工程
        avatarUrl:
          type: string
          nullable: true
          example: null
        phone:
          type: string
          nullable: true
          example: '13900000000'
        email:
          type: string
          format: email
          nullable: true
          example: wangxm@example.com
        role:
          type: integer
          nullable: true
          description: 1 学员 / 2 管理员，默认 1
          example: 1
        accountStatus:
          type: integer
          nullable: true
          description: 1 正常 / 2 禁用，默认 1
          example: 1

    UserStatusRequest:
      type: object
      required: [accountStatus]
      properties:
        accountStatus:
          type: integer
          description: 1 正常 / 2 禁用
          example: 2

    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          format: password
          nullable: true
          description: 不传时重置为 123456
          example: '123456'

    DepartmentSaveRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: 数据平台部
        managerName:
          type: string
          nullable: true
          example: 张伟
        description:
          type: string
          nullable: true
          example: 负责数据中台与 BI 建设
        status:
          type: integer
          nullable: true
          description: 1 启用 / 2 停用，默认 1
          example: 1
        sortNo:
          type: integer
          nullable: true
          example: 9

    StatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          description: 目标状态值，含义随业务不同
          example: 2

    CourseSaveRequest:
      type: object
      required: [title, categoryId]
      properties:
        title:
          type: string
          example: 云原生微服务架构实战
        categoryId:
          type: integer
          format: int64
          example: 1
        subcategoryLabel:
          type: string
          nullable: true
          example: 研发架构
        instructorId:
          type: integer
          format: int64
          nullable: true
          example: 1
        isRequired:
          type: boolean
          nullable: true
          description: true 必修 / false 选修
          example: true
        level:
          type: string
          nullable: true
          example: 进阶技术
        totalHours:
          type: number
          format: double
          nullable: true
          example: 6.5
        thumbnailUrl:
          type: string
          nullable: true
          example: null
        summary:
          type: string
          nullable: true
          example: 从 0 到 1 掌握微服务拆分与治理
        description:
          type: string
          nullable: true
          example: 完整的微服务架构课程
        status:
          type: integer
          nullable: true
          description: 1 草稿 / 2 已上架 / 3 已下架
          example: 1
        enrollCount:
          type: integer
          nullable: true
          description: 展示用报名人数
          example: 0
        tagIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
          example: [1, 2]

    ChapterSaveRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: 第一章 微服务拆分
        sortNo:
          type: integer
          nullable: true
          example: 1

    LessonSaveRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: 1.1 服务边界划分
        durationSeconds:
          type: integer
          nullable: true
          example: 900
        videoUrl:
          type: string
          nullable: true
          example: http://127.0.0.1:8080/api/files/view/course/demo.mp4
        sortNo:
          type: integer
          nullable: true
          example: 1

    NameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: 微服务

    InstructorSaveRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: 陈老师
        title:
          type: string
          nullable: true
          example: 资深架构师
        isOrg:
          type: boolean
          nullable: true
          description: true 机构讲师 / false 个人讲师
          example: false
        avatarUrl:
          type: string
          nullable: true
          example: null

    TrackSaveRequest:
      type: object
      required: [title]
      properties:
        category:
          type: string
          nullable: true
          description: security / tech / leadership
          example: security
        categoryLabel:
          type: string
          nullable: true
          example: 信息安全
        title:
          type: string
          example: 零信任安全架构实战
        thumbnailUrl:
          type: string
          nullable: true
          example: null
        summary:
          type: string
          nullable: true
          example: 从边界防护到零信任
        description:
          type: string
          nullable: true
          example: 系统学习零信任架构
        lectureCount:
          type: integer
          nullable: true
          example: 12
        studentCount:
          type: integer
          nullable: true
          description: 展示用学习人数
          example: 0
        durationLabel:
          type: string
          nullable: true
          example: 约 3 小时
        level:
          type: integer
          nullable: true
          description: 1 入门 / 2 进阶 / 3 高级
          example: 2
        audience:
          type: string
          nullable: true
          example: 架构师、安全工程师
        status:
          type: integer
          nullable: true
          description: 1 草稿 / 2 已上架 / 3 已下架
          example: 1
        sortNo:
          type: integer
          nullable: true
          example: 1
        outline:
          type: array
          nullable: true
          items: { type: string }
          example: [身份认证, 权限模型, 微隔离]
        courseIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
          example: [1, 2]

    ExamSaveRequest:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          description: 考试编号，全局唯一
          example: ZK-20261201-01
        title:
          type: string
          example: 2026年度微服务架构认证考试
        organizer:
          type: string
          nullable: true
          example: 技术研发部 · 2026Q4
        examType:
          type: string
          nullable: true
          example: 技术认证
        status:
          type: integer
          nullable: true
          description: 1 草稿 / 2 未开始 / 3 进行中 / 4 已结束 / 5 随时可考
          example: 1
        location:
          type: string
          nullable: true
          example: 在线网页自适应考试
        startAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-01T14:00:00'
        endAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-01T15:30:00'
        durationMinutes:
          type: integer
          nullable: true
          description: 默认 60
          example: 90
        totalScore:
          type: number
          format: double
          nullable: true
          description: 默认 100
          example: 100
        passScore:
          type: number
          format: double
          nullable: true
          description: 默认 60
          example: 60
        isDoubleCamera:
          type: boolean
          nullable: true
          example: false
        relatedCourseId:
          type: integer
          format: int64
          nullable: true
          example: 1
        relatedCourseText:
          type: string
          nullable: true
          example: 《云原生微服务架构实战》
        remainingChance:
          type: integer
          nullable: true
          description: 展示用剩余机会次数
          example: 2

    AssignRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items: { type: integer, format: int64 }
          example: [1, 2, 3]
        attemptsAllowed:
          type: integer
          nullable: true
          description: 允许作答次数，默认 1
          example: 2
        deadlineAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-12-31T23:59:00'

    GradeRequest:
      type: object
      description: answers 与 subjectiveScore 二选一；answers 存在时按题评分
      properties:
        subjectiveScore:
          type: number
          format: double
          nullable: true
          example: 10
