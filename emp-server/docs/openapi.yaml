  /files/upload:
    post:
      tags: [文件]
      summary: 上传文件（服务端转发）
      description: |-
        multipart/form-data；适合头像、图片、PDF 等小文件。
        仅允许图片、音视频、PDF、Office、txt、zip、rar 等受支持扩展名；HTML/SVG/脚本会被拒绝。
        video / cover / courseware 目录仅管理员可写。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  description: 目录，仅支持 avatar / cover / video / courseware / attachment / notice / common / misc
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: ok
                data:
                  objectName: avatar/2026/11/897480d845904a88976368c26a7e7367.png
                  fileName: avatar.png
                  size: 20480
                  contentType: image/png
                  url: http://127.0.0.1:8080/api/files/view/avatar/2026/11/897480d845904a88976368c26a7e7367.png
                  directUrl: http://127.0.0.1:9000/emp-academy/avatar/2026/11/897480d845904a88976368c26a7e7367.png
                  presignedUrl: http://127.0.0.1:9000/emp-academy/avatar/2026/11/897480d845904a88976368c26a7e7367.png?X-Amz-Algorithm=...
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /files/presign-upload:
    post:
      tags: [文件]
      summary: 获取直传预签名地址（管理员）
      description: |-
        大文件（课程视频）由前端直接 PUT 到返回的 uploadUrl，再把 objectName 保存到业务表。
        仅管理员可用，文件扩展名与 Content-Type 由服务端校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
            example:
              fileName: course-video.mp4
              contentType: video/mp4
              folder: video
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
