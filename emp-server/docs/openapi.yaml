        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files:
    delete:
      tags: [文件]
      summary: 删除文件（管理员）
      parameters:
        - $ref: '#/components/parameters/ObjectNameQuery'
      responses:
        '200': { $ref: '#/components/responses/OkVoid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/view/{objectName}:
    get:
      tags: [文件]
      summary: 稳定访问文件（公开）
      description: |-
        直接返回文件字节流，可用于 img / video / a 标签。objectName 可包含 `/`，请按实际对象路径拼接。
        注意：部分客户端会把路径中的 `/` 编码成 `%2F`（Tomcat 默认返回 400）。遇到这种情况，请直接使用上传接口返回的完整 `url`，或改用 `GET /files/presign?objectName=...` 获取预签名地址。
      security: []
      parameters:
        - $ref: '#/components/parameters/ObjectNamePath'
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

