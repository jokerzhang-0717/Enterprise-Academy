openapi: 3.0.3
info:
  title: 企业学堂（Enterprise Academy）API
  version: 1.0.0
  description: |
    企业学堂后端接口文档，可直接导入 Apifox / Postman / Swagger Editor。

    - 服务地址：`http://127.0.0.1:8080/api`（Spring Boot context-path 为 `/api`）
    - 鉴权方式：登录后把 `data.token` 放入请求头 `Authorization: Bearer <token>`；只接受该请求头，不再兼容 `X-Token` 或 `?token=`
    - 访问令牌默认 15 分钟；过期后用 `POST /auth/refresh` 与 `data.refreshToken` 换发新令牌
    - 退出登录、修改密码或账号停用后，相关令牌立即失效
    - 管理端接口（`/admin/**` 以及 `POST /notifications/send`）要求账号角色 `role=2`
    - 统一响应：`{ "code": 0, "message": "ok", "data": ... }`
    - 分页响应：`data` 为 `{ total, page, size, records }`
    - 时间格式：`LocalDateTime` 为 `yyyy-MM-ddTHH:mm:ss`，`LocalDate` 为 `yyyy-MM-dd`，`LocalTime` 为 `HH:mm:ss`
    - 错误码与 HTTP 状态码一致：400 参数错误、401 未登录、403 无权限、404 不存在、409 冲突、413 文件过大、415 请求格式不支持、429 请求过于频繁

    演示账号：学员 `EMP-2024098 / 123456`，管理员 `admin / 123456`。
servers:
  - url: http://127.0.0.1:8080/api
    description: 本地开发环境
security:
  - bearerAuth: []
tags:
  - name: 认证与个人
    description: 登录、注册、当前用户、个人资料
  - name: 学员端-首页
    description: 学员首页看板
  - name: 学员端-课程
    description: 课程目录、详情、报名、学习进度
  - name: 学员端-研修通道
    description: 已上架研修通道
  - name: 学员端-考试
    description: 我的考试、试卷、作答、交卷
  - name: 学员端-考勤与请假
    description: 签到签退、请假申请
  - name: 学员端-证书
    description: 我的证书、证书验真
  - name: 学员端-公告与通知
    description: 公告、站内通知
  - name: 文件
    description: MinIO 文件上传、下载、删除
  - name: 管理端-看板与日志
    description: 管理看板、最新动态、操作日志
  - name: 管理端-用户与部门
    description: 学员管理、部门管理
  - name: 管理端-课程与题库
    description: 课程、章节、课时、标签、讲师、题库
  - name: 管理端-研修通道
    description: 研修通道管理
  - name: 管理端-考试
    description: 考试、指派、答卷、评分
  - name: 管理端-考勤请假证书公告
    description: 请假审批、签到管理、证书管理、公告管理
paths:
  /auth/login:
    post:
      tags: [认证与个人]
      summary: 登录
      description: 使用企业工号和密码登录，返回 15 分钟访问令牌和 7 天刷新令牌。该接口无需鉴权；连续失败会返回 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              employeeNo: EMP-2024098
              password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: ok
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.signature
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: b_V4Y2F0aW9uLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ
                  refreshExpiresIn: 604800
                  user:
                    id: 1
                    employeeNo: EMP-2024098
                    name: 李明
                    departmentId: 1
                    department: 技术研发部
                    jobTitle: 高级研发工程师
                    grade: P6 高级研发
                    specialty: 云原生与微服务
                    avatarUrl: null
                    phone: '13800000000'
                    email: liming@example.com
                    role: 1
                    accountStatus: 1
                    lastActiveAt: '2026-11-06T09:30:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [认证与个人]
      summary: 刷新访问令牌
      description: 使用登录返回的 `refreshToken` 换发新的访问令牌与刷新令牌。刷新令牌一次性使用；账号停用或密码变更后返回 401。该接口无需鉴权。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: b_V4Y2F0aW9uLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ
      responses:
        '200':
          description: 刷新成功，返回新的访问令牌与刷新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: ok
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.new-signature
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: bmV3LXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ
                  refreshExpiresIn: 604800
                  user:
                    id: 1
                    employeeNo: EMP-2024098
                    name: 李明
                    role: 1
                    accountStatus: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register:
    post:
      tags: [认证与个人]
      summary: 注册学员账号
      description: 自助注册，默认角色为学员（role=1）。该接口无需鉴权。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: 王小明
              employeeNo: EMP-2026001
              password: '123456'
              departmentId: 1
              jobTitle: 研发工程师
              email: wangxm@example.com
              phone: '13900000000'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [认证与个人]
      summary: 当前登录用户
      description: 返回当前用户资料及学习统计字段（learningHours、completedCourses、studyingCourses、certificateCount、unreadNotifications）。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    put:
      tags: [认证与个人]
      summary: 修改登录密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: '123456'
              newPassword: '654321'
      responses:
        '200': { $ref: '#/components/responses/OkVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [认证与个人]
      summary: 退出登录
      description: 吊销刷新令牌，并将当前访问令牌写入黑名单直到自然过期。该接口无需鉴权，访问令牌过期后仍可吊销刷新令牌。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refreshToken: b_V4Y2F0aW9uLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ
      responses:
        '200': { $ref: '#/components/responses/OkVoid' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /profile:
    get:
      tags: [认证与个人]
      summary: 获取个人资料
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [认证与个人]
      summary: 更新个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              name: 李明
              phone: '13800000000'
              email: liming@example.com
              jobTitle: 高级研发工程师
              specialty: 云原生与微服务
              grade: P6 高级研发
              avatarUrl: http://127.0.0.1:8080/api/files/view/avatar/demo.png
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      tags: [学员端-首页]
      summary: 学员首页看板
      description: 返回学习统计、待办、推荐课程、公告、今日签到等聚合数据。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses:
    get:
      tags: [学员端-课程]
      summary: 课程目录（分页）
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery12'
        - $ref: '#/components/parameters/KeywordQuery'
        - name: category
          in: query
          required: false
          description: 课程分类标识或名称
          schema: { type: string }
        - name: required
          in: query
          required: false
          description: 是否必修
          schema: { type: boolean }
        - name: status
          in: query
          required: false
          description: 课程状态文案或编码
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: ok
                data:
                  total: 12
                  page: 1
                  size: 12
                  records:
                    - id: 1
                      title: 云原生微服务架构实战
                      category: 技术研发
                      categoryLabel: 技术研发
                      level: 进阶技术
                      isRequired: true
                      totalHours: 6.5
                      lessonCount: 12
                      enrollCount: 320
                      thumbnailUrl: null
                      summary: 从 0 到 1 掌握微服务拆分与治理
                      status: 2
                      statusLabel: 已上架
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses/my-learning:
    get:
      tags: [学员端-课程]
      summary: 我的学习
      description: 返回当前学员已报名课程及学习进度。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses/{id}:
    get:
      tags: [学员端-课程]
      summary: 课程详情
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /courses/{id}/enroll:
    post:
      tags: [学员端-课程]
      summary: 报名课程
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /courses/{id}/lessons/{lessonId}:
    get:
      tags: [学员端-课程]
      summary: 获取课时播放信息
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/LessonIdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /courses/{id}/lessons/{lessonId}/progress:
    post:
      tags: [学员端-课程]
      summary: 上报课时学习进度
      description: >-
        watchedSeconds 仅用于断点续播，服务端会按课时时长截断且不作为完成依据。
        标记 completed=true 时，服务端按 study_session 累计学习时长校验，未达到课时时长一半
        （最少 30 秒、最多 30 分钟；未配置时长时要求 60 秒）会返回 400。
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
            example:
              watchedSeconds: 600
              completed: true
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /courses/{id}/lessons/{lessonId}/study-sessions:
    post:
      tags: [学员端-课程]
      summary: 开始课时学习计时
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/LessonIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudySessionRequest'
            example:
              sessionId: 7f6f2e5e-1b98-49a3-a31b-4e8208e8f91a
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /study-sessions/{sessionId}/heartbeat:
    post:
      tags: [学员端-课程]
      summary: 上报学习计时心跳
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /study-sessions/{sessionId}/stop:
    post:
      tags: [学员端-课程]
      summary: 停止课时学习计时并结算学时
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /course-categories:
    get:
      tags: [学员端-课程]
      summary: 课程分类列表
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /course-tags:
    get:
      tags: [学员端-课程]
      summary: 课程标签列表
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /instructors:
    get:
      tags: [学员端-课程]
      summary: 讲师列表
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tracks:
    get:
      tags: [学员端-研修通道]
      summary: 已上架研修通道（分页）
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery12'
        - $ref: '#/components/parameters/KeywordQuery'
        - name: category
          in: query
          required: false
          description: security / tech / leadership
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tracks/all:
    get:
      tags: [学员端-研修通道]
      summary: 全部已上架通道
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tracks/{id}:
    get:
      tags: [学员端-研修通道]
      summary: 研修通道详情
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams:
    get:
      tags: [学员端-考试]
      summary: 我的考试
      description: 返回待参加考试 `assignments` 与往期记录 `past`。status 为展示文案，statusCode 为原始编码。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 0
                message: ok
                data:
                  assignments:
                    - examId: 1
                      title: 2025年度第二季度研发部全栈开发规范与安全编码认证考试
                      code: ZK-20250422-09
                      examStatusCode: 3
                      examStatus: 进行中
                      assignmentStatusCode: 1
                      assignmentStatus: 待参加
                      status: 待参加
                      startAt: '2025-04-18T14:00:00'
                      endAt: '2025-04-18T15:30:00'
                      timeWindow: 2025-04-18 14:00 ~ 2025-04-18 15:30
                      durationMinutes: 90
                      questionCount: 25
                      totalScore: 100.0
                      passScore: 60.0
                      attemptsAllowed: 2
                      attemptsUsed: 0
                  past: []
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exams/metrics:
    get:
      tags: [学员端-考试]
      summary: 我的考试统计
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exams/past:
    get:
      tags: [学员端-考试]
      summary: 往期考试记录
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exams/{id}/paper:
    get:
      tags: [学员端-考试]
      summary: 获取试卷
      description: 若存在作答中的答卷，会一并返回 attempt，可用于断点续考。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/{id}/start:
    post:
      tags: [学员端-考试]
      summary: 开始考试
      description: 创建或复用作答中的答卷，返回 attemptId 和题目列表。
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/attempts/{attemptId}:
    get:
      tags: [学员端-考试]
      summary: 答卷详情
      parameters:
        - $ref: '#/components/parameters/AttemptIdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/attempts/{attemptId}/answers:
    post:
      tags: [学员端-考试]
      summary: 保存单题答案
      description: 客观题传 selectedKeys（如 `A` 或 `ABD`），主观题传 answerText。
      parameters:
        - $ref: '#/components/parameters/AttemptIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSaveRequest'
            example:
              questionId: 1
              selectedKeys: A
              answerText: null
              flagged: false
              remainingSeconds: 1800
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/attempts/{attemptId}/switch:
    post:
      tags: [学员端-考试]
      summary: 记录切屏
      description: 切屏次数用于防作弊展示。
      parameters:
        - $ref: '#/components/parameters/AttemptIdPath'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/attempts/{attemptId}/submit:
    post:
      tags: [学员端-考试]
      summary: 交卷
      description: 客观题自动判分；含主观题时状态为待评分（2），全部为客观题时直接已评分（3）。
      parameters:
